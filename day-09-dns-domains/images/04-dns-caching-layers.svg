<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 15px; fill: #475569; }
    .box-title { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .box-text { font-size: 14px; fill: #f1f5f9; }
    .head { font-size: 16px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 14px; fill: #334155; }
    .mono { font-size: 13px; fill: #0f172a; font-family: Consolas, Menlo, monospace; }
    .ok { font-size: 15px; font-weight: 700; fill: #15803d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="820" rx="16" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="title">DNS Caching - 3 Layers That Showed Me Old Answers</text>
  <text x="600" y="72" text-anchor="middle" class="sub">Route 53 was right every time. Caches kept the old answer until its TTL ran out.</text>

  <!-- chain -->
  <rect x="30" y="100" width="190" height="90" rx="12" fill="#475569"/>
  <text x="125" y="140" text-anchor="middle" class="box-title">Browser</text>
  <text x="125" y="165" text-anchor="middle" class="box-text">Firefox cache</text>
  <line x1="220" y1="145" x2="270" y2="145" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <rect x="275" y="100" width="190" height="90" rx="12" fill="#ea580c"/>
  <text x="370" y="140" text-anchor="middle" class="box-title">Home router</text>
  <text x="370" y="165" text-anchor="middle" class="box-text">DNS cache</text>
  <line x1="465" y1="145" x2="515" y2="145" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <rect x="520" y="100" width="190" height="90" rx="12" fill="#7c3aed"/>
  <text x="615" y="140" text-anchor="middle" class="box-title">VPC resolver</text>
  <text x="615" y="165" text-anchor="middle" class="box-text">172.31.0.2 (EC2)</text>
  <line x1="710" y1="145" x2="760" y2="145" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <rect x="765" y="100" width="190" height="90" rx="12" fill="#0891b2"/>
  <text x="860" y="140" text-anchor="middle" class="box-title">.store registry</text>
  <text x="860" y="165" text-anchor="middle" class="box-text">NS → Route 53 (900s)</text>
  <line x1="955" y1="145" x2="1005" y2="145" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1010" y="100" width="160" height="90" rx="12" fill="#16a34a"/>
  <text x="1090" y="140" text-anchor="middle" class="box-title">Route 53</text>
  <text x="1090" y="165" text-anchor="middle" class="box-text">the truth ✅</text>

  <!-- case 1 -->
  <rect x="30" y="220" width="1140" height="160" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="50" y="248" class="head">1 · Home router - kept Namecheap's old answer (~30 min)</text>
  <text x="50" y="276" class="note">I opened the domain before switching nameservers. The router cached Namecheap's redirect server.</text>
  <text x="50" y="304" class="mono">dig abhignadevops.store @192.168.1.254 → 192.64.119.37  TTL 1311   (Google 8.8.8.8 → 3.237.184.179 ✅)</text>
  <text x="50" y="332" class="note">Result: browser got a redirect to www instead of my app.</text>
  <text x="50" y="360" class="ok">Fix: wait for the TTL / use another DNS (8.8.8.8) / phone on mobile data.</text>

  <!-- case 2 -->
  <rect x="30" y="395" width="1140" height="170" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="50" y="423" class="head">2 · VPC resolver - cached "NOT FOUND" (negative caching, 900s)</text>
  <text x="50" y="451" class="note">I ran getent for frontend-1 / frontend-2 before creating the records. The resolver cached NXDOMAIN.</text>
  <text x="50" y="479" class="mono">nginx: [emerg] host not found in upstream "frontend-1.abhignadevops.store:80"</text>
  <text x="50" y="503" class="mono">dig ... @8.8.8.8 → 172.31.2.206 ✅    dig ... (VPC) → status: NXDOMAIN, SOA TTL 246 left</text>
  <text x="50" y="531" class="note">How long "not found" is cached = from the zone's SOA record (900s here).</text>
  <text x="50" y="555" class="ok">Fix: wait ~4 min. Next time create records BEFORE anything looks them up.</text>

  <!-- case 3 -->
  <rect x="30" y="580" width="1140" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="608" class="head">3 · Browser - showed Namecheap's parking page on www</text>
  <text x="50" y="636" class="note">curl and every DNS server gave the LB IP, but Firefox still showed "recently registered with namecheap.com".</text>
  <text x="50" y="664" class="note">Firefox has its own DNS cache and page cache (and the browser VPN uses its own DNS).</text>
  <text x="50" y="692" class="ok">Fix: Ctrl+Shift+R · about:networking#dns → Clear DNS Cache · VPN off · private window.</text>

  <rect x="30" y="745" width="1140" height="60" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="600" y="782" text-anchor="middle" class="head">Rule: create records first, keep TTL 60 in labs, don't open the domain until DNS points to your servers.</text>
</svg>
