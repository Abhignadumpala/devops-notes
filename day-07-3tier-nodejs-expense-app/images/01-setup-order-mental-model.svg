<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 15px; fill: #475569; }
    .phase { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box-title { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .box-text { font-size: 13px; fill: #f1f5f9; }
    .label { font-size: 14px; fill: #0f172a; }
    .ok { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { font-size: 14px; font-weight: 700; fill: #dc2626; }
    .step { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 15px; fill: #334155; }
    .big { font-size: 17px; font-weight: 700; fill: #1e293b; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="1000" rx="16" fill="#ffffff"/>

  <text x="600" y="48" text-anchor="middle" class="title">Mental Model: Build in REVERSE of the Request Flow</text>
  <text x="600" y="76" text-anchor="middle" class="sub">Requests go Browser → Frontend → Backend → DB. So we BUILD DB → Backend → Frontend.</text>

  <!-- Panel 1: flow vs setup order -->
  <rect x="30" y="100" width="1140" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="130" class="phase">Request flow vs setup order</text>

  <rect x="70" y="170" width="200" height="90" rx="12" fill="#64748b"/>
  <text x="170" y="205" text-anchor="middle" class="box-title">Browser</text>
  <text x="170" y="230" text-anchor="middle" class="box-text">user opens the app</text>

  <rect x="360" y="170" width="200" height="90" rx="12" fill="#2563eb"/>
  <text x="460" y="205" text-anchor="middle" class="box-title">Frontend</text>
  <text x="460" y="230" text-anchor="middle" class="box-text">Nginx + /api/ proxy</text>

  <rect x="650" y="170" width="200" height="90" rx="12" fill="#7c3aed"/>
  <text x="750" y="205" text-anchor="middle" class="box-title">Backend</text>
  <text x="750" y="230" text-anchor="middle" class="box-text">Node.js :8080 + schema load</text>

  <rect x="940" y="170" width="200" height="90" rx="12" fill="#0d9488"/>
  <text x="1040" y="205" text-anchor="middle" class="box-title">MySQL DB</text>
  <text x="1040" y="230" text-anchor="middle" class="box-text">mysqld :3306 + root password</text>

  <!-- setup order circles -->
  <circle cx="1125" cy="172" r="17" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="1125" y="177" text-anchor="middle" class="step">1</text>
  <circle cx="835" cy="172" r="17" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="835" y="177" text-anchor="middle" class="step">2</text>
  <circle cx="545" cy="172" r="17" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="545" y="177" text-anchor="middle" class="step">3</text>
  <circle cx="255" cy="172" r="17" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="255" y="177" text-anchor="middle" class="step">4</text>

  <!-- request arrows (grey, left to right) -->
  <line x1="275" y1="198" x2="353" y2="198" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="565" y1="198" x2="643" y2="198" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="855" y1="198" x2="933" y2="198" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- setup arrows (green, right to left) -->
  <line x1="935" y1="238" x2="857" y2="238" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <line x1="645" y1="238" x2="567" y2="238" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <line x1="355" y1="238" x2="277" y2="238" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>

  <line x1="80" y1="295" x2="130" y2="295" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="140" y="300" class="label">request flow (how the app runs)</text>
  <line x1="460" y1="295" x2="510" y2="295" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="520" y="300" class="label">setup order (how we build it) - numbers 1 → 4</text>
  <text x="80" y="330" class="note">Build what others depend on FIRST. The backend depends on the DB, the frontend depends on the backend.</text>

  <!-- Panel 2: right way -->
  <rect x="30" y="370" width="560" height="420" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="50" y="402" class="phase">✅ Right way: DB → Backend → Frontend</text>

  <rect x="55" y="420" width="510" height="78" rx="10" fill="#0d9488"/>
  <circle cx="82" cy="459" r="15" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="82" y="464" text-anchor="middle" class="step">1</text>
  <text x="108" y="450" class="box-title" style="font-size:17px">MySQL: install, start, set root password</text>
  <text x="108" y="478" class="box-text">DB now EXISTS and KNOWS its root password</text>

  <rect x="55" y="510" width="510" height="98" rx="10" fill="#7c3aed"/>
  <circle cx="82" cy="549" r="15" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="82" y="554" text-anchor="middle" class="step">2</text>
  <text x="108" y="538" class="box-title" style="font-size:17px">Backend: load schema, start service</text>
  <text x="108" y="563" class="box-text">schema logs in as root → creates DB, table, `expense` user</text>
  <text x="108" y="588" class="box-text">curl localhost:8080/health → {"db":"up"}</text>

  <rect x="55" y="620" width="510" height="78" rx="10" fill="#2563eb"/>
  <circle cx="82" cy="659" r="15" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="82" y="664" text-anchor="middle" class="step">3</text>
  <text x="108" y="650" class="box-title" style="font-size:17px">Frontend: Nginx + /api/ → backend:8080</text>
  <text x="108" y="678" class="box-text">curl localhost/api/health → {"status":"ok"}</text>

  <rect x="55" y="710" width="510" height="60" rx="10" fill="#64748b"/>
  <circle cx="82" cy="740" r="15" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="82" y="745" text-anchor="middle" class="step">4</text>
  <text x="108" y="747" class="box-title" style="font-size:17px">Browser: UI loads - no errors ✅</text>

  <!-- Panel 3: wrong way -->
  <rect x="610" y="370" width="560" height="420" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="630" y="402" class="phase">❌ Wrong way (what I did): Frontend → Backend → DB</text>

  <rect x="635" y="420" width="510" height="78" rx="10" fill="#2563eb"/>
  <circle cx="662" cy="459" r="15" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="662" y="464" text-anchor="middle" class="step">1</text>
  <text x="688" y="450" class="box-title" style="font-size:17px">Frontend first</text>
  <text x="688" y="478" class="box-text">/api/health → 5XX (no backend running yet)</text>

  <rect x="635" y="510" width="510" height="98" rx="10" fill="#7c3aed"/>
  <circle cx="662" cy="549" r="15" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="662" y="554" text-anchor="middle" class="step">2</text>
  <text x="688" y="538" class="box-title" style="font-size:17px">Backend next - loads schema...</text>
  <text x="688" y="563" class="box-text">...into a DB that doesn't exist → ERROR 2003 (111)</text>
  <text x="688" y="588" class="box-text">`expense` user never created → Access denied for 'expense'</text>

  <rect x="635" y="620" width="510" height="78" rx="10" fill="#0d9488"/>
  <circle cx="662" cy="659" r="15" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="662" y="664" text-anchor="middle" class="step">3</text>
  <text x="688" y="650" class="box-title" style="font-size:17px">DB last - too late</text>
  <text x="688" y="678" class="box-text">password set now, but the schema was never loaded</text>

  <rect x="635" y="710" width="510" height="60" rx="10" fill="#dc2626"/>
  <text x="890" y="747" text-anchor="middle" class="box-title" style="font-size:17px">↩ Go BACK to backend: reload schema, restart</text>

  <!-- Bottom: the key question -->
  <rect x="30" y="810" width="1140" height="165" rx="14" fill="#fefce8" stroke="#fde047"/>
  <text x="50" y="842" class="phase">🤔 The question that explains it all</text>
  <text x="50" y="875" class="big">"The backend loads the schema as root - but if the DB doesn't exist yet, how does it know the password?"</text>
  <text x="50" y="905" class="note">It can't. No DB = nothing to log in to = no schema = no `expense` user = "db":"down" errors on every tier above it.</text>
  <text x="50" y="940" class="ok">Rule: build from the bottom up - DB → Backend → Frontend - and test each tier before moving up.</text>
  <text x="50" y="962" class="sub" xml:space="preserve">Check before the next tier:   DB → mysql -u root -p -e "SELECT 1;"   •   Backend → curl localhost:8080/health   •   Frontend → curl localhost/api/health</text>
</svg>
