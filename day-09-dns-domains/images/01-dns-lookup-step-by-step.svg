<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 15px; fill: #475569; }
    .phase { font-size: 17px; font-weight: 700; fill: #1e293b; }
    .box-title { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .box-text { font-size: 14px; fill: #f1f5f9; }
    .label { font-size: 14px; fill: #0f172a; }
    .hit { font-size: 14px; font-weight: 700; fill: #15803d; }
    .miss { font-size: 13px; font-weight: 700; fill: #dc2626; }
    .step { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 15px; fill: #334155; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="980" rx="16" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="title">How a DNS Lookup Works: mydevops.com → IP Address</text>
  <text x="600" y="72" text-anchor="middle" class="sub">Nearest first. Each place checks its cache. Only if nobody knows, the ISP resolver walks Root → TLD → Nameservers.</text>

  <!-- ===== Phase 1: caches ===== -->
  <rect x="20" y="90" width="1160" height="196" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="40" y="116" class="phase">Phase 1 - Check the caches (nearest first)</text>

  <rect x="40" y="130" width="230" height="86" rx="12" fill="#475569"/>
  <text x="155" y="166" text-anchor="middle" class="box-title">You</text>
  <text x="155" y="192" text-anchor="middle" class="box-text">type mydevops.com in browser</text>

  <rect x="340" y="130" width="230" height="86" rx="12" fill="#7c3aed"/>
  <text x="455" y="166" text-anchor="middle" class="box-title">① Browser cache</text>
  <text x="455" y="192" text-anchor="middle" class="box-text">sites you opened recently</text>

  <rect x="640" y="130" width="230" height="86" rx="12" fill="#9333ea"/>
  <text x="755" y="166" text-anchor="middle" class="box-title">② OS cache</text>
  <text x="755" y="192" text-anchor="middle" class="box-text">Windows / Linux / Mac</text>

  <rect x="940" y="130" width="230" height="86" rx="12" fill="#c026d3"/>
  <text x="1055" y="166" text-anchor="middle" class="box-title">③ ISP resolver cache</text>
  <text x="1055" y="192" text-anchor="middle" class="box-text">anyone on your ISP asked?</text>

  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="272" y1="173" x2="336" y2="173"/>
  </g>
  <g stroke="#dc2626" stroke-width="3" marker-end="url(#r)">
    <line x1="572" y1="173" x2="636" y2="173"/>
    <line x1="872" y1="173" x2="936" y2="173"/>
  </g>
  <text x="604" y="162" text-anchor="middle" class="miss">no ✗</text>
  <text x="904" y="162" text-anchor="middle" class="miss">no ✗</text>

  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.5">
    <rect x="370" y="232" width="170" height="34" rx="17"/>
    <rect x="670" y="232" width="170" height="34" rx="17"/>
    <rect x="970" y="232" width="170" height="34" rx="17"/>
  </g>
  <text x="455" y="254" text-anchor="middle" class="hit">✓ knows → use IP</text>
  <text x="755" y="254" text-anchor="middle" class="hit">✓ knows → use IP</text>
  <text x="1055" y="254" text-anchor="middle" class="hit">✓ knows → use IP</text>

  <!-- miss path down to resolver -->
  <path d="M1172,173 H1188 V313 H170 V386" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <rect x="440" y="300" width="400" height="26" rx="13" fill="#ffffff" stroke="#fecaca"/>
  <text x="640" y="318" text-anchor="middle" class="miss">no ✗  not cached anywhere → resolver goes searching</text>

  <!-- ===== Phase 2: resolver search ===== -->
  <rect x="20" y="340" width="1160" height="460" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="330" y="366" class="phase">Phase 2 - ISP DNS resolver finds the IP</text>

  <rect x="40" y="390" width="260" height="390" rx="12" fill="#2563eb"/>
  <text x="170" y="560" text-anchor="middle" class="box-title">ISP DNS Resolver</text>
  <text x="170" y="588" text-anchor="middle" class="box-text">does the searching</text>
  <text x="170" y="610" text-anchor="middle" class="box-text">for you</text>

  <!-- servers -->
  <rect x="880" y="395" width="290" height="110" rx="12" fill="#dc2626"/>
  <text x="1025" y="432" text-anchor="middle" class="box-title">Root servers</text>
  <text x="1025" y="458" text-anchor="middle" class="box-text">top of DNS, worldwide</text>
  <text x="1025" y="480" text-anchor="middle" class="box-text">knows: which TLD to ask</text>

  <rect x="880" y="530" width="290" height="110" rx="12" fill="#ea580c"/>
  <text x="1025" y="567" text-anchor="middle" class="box-title">.com TLD registry</text>
  <text x="1025" y="593" text-anchor="middle" class="box-text">knows: which nameservers</text>
  <text x="1025" y="615" text-anchor="middle" class="box-text">manage mydevops.com</text>

  <rect x="880" y="665" width="290" height="110" rx="12" fill="#0d9488"/>
  <text x="1025" y="702" text-anchor="middle" class="box-title">Nameservers</text>
  <text x="1025" y="728" text-anchor="middle" class="box-text">e.g. GoDaddy / Route 53</text>
  <text x="1025" y="750" text-anchor="middle" class="box-text">hold the A record → real IP</text>

  <!-- requests (resolver → server) -->
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="302" y1="430" x2="876" y2="430"/>
    <line x1="302" y1="565" x2="876" y2="565"/>
    <line x1="302" y1="700" x2="876" y2="700"/>
  </g>
  <!-- replies (server → resolver) -->
  <line x1="878" y1="475" x2="304" y2="475" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#r)"/>
  <line x1="878" y1="610" x2="304" y2="610" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#o)"/>
  <line x1="878" y1="745" x2="304" y2="745" stroke="#0d9488" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#t)"/>

  <g>
    <circle cx="330" cy="415" r="12" fill="#475569"/><text x="330" y="420" text-anchor="middle" class="step">1</text>
    <text x="350" y="420" class="label">"Who manages .com?"</text>
    <circle cx="330" cy="460" r="12" fill="#dc2626"/><text x="330" y="465" text-anchor="middle" class="step">2</text>
    <text x="350" y="465" class="label">"I don't know the IP - ask the .com TLD registry"</text>

    <circle cx="330" cy="550" r="12" fill="#475569"/><text x="330" y="555" text-anchor="middle" class="step">3</text>
    <text x="350" y="555" class="label">"Who manages mydevops.com?"</text>
    <circle cx="330" cy="595" r="12" fill="#ea580c"/><text x="330" y="600" text-anchor="middle" class="step">4</text>
    <text x="350" y="600" class="label">"I don't know the IP, but these nameservers manage it"</text>

    <circle cx="330" cy="685" r="12" fill="#475569"/><text x="330" y="690" text-anchor="middle" class="step">5</text>
    <text x="350" y="690" class="label">"What's the IP of mydevops.com?"</text>
    <circle cx="330" cy="730" r="12" fill="#0d9488"/><text x="330" y="735" text-anchor="middle" class="step">6</text>
    <text x="350" y="735" class="label" font-weight="700">"203.0.113.10" ✓</text>
  </g>

  <!-- ===== Result ===== -->
  <line x1="170" y1="782" x2="170" y2="822" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <rect x="40" y="826" width="1130" height="66" rx="12" fill="#16a34a"/>
  <circle cx="76" cy="859" r="14" fill="#ffffff"/><text x="76" y="864" text-anchor="middle" class="step" fill="#16a34a" style="fill:#16a34a">7</text>
  <text x="104" y="853" class="box-title">Browser connects to 203.0.113.10 - website opens</text>
  <text x="104" y="876" class="box-text">IP goes back resolver → OS → browser, and each one saves it in its cache for next time</text>

  <text x="600" y="930" text-anchor="middle" class="note">Most lookups stop in Phase 1 - caching skips the full trip. All of this happens in milliseconds.</text>
  <text x="600" y="956" text-anchor="middle" class="sub">Solid arrow = question from resolver · Dashed arrow = answer back</text>
</svg>
