<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 30px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 21px; font-weight: 700; }
    .card-text { font-size: 15px; fill: #334155; }
    .mono { font-family: Consolas, Menlo, monospace; font-size: 15px; fill: #0f172a; }
    .label { font-size: 15px; fill: #334155; }
    .head { font-size: 18px; font-weight: 700; fill: #1e293b; }
  </style>
  <rect width="1200" height="690" rx="16" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" class="title">Why Nginx Is Popular - One Tool, Many Jobs</text>

  <!-- spokes -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="600" y1="300" x2="600" y2="105"/>
    <line x1="600" y1="300" x2="210" y2="225"/>
    <line x1="600" y1="300" x2="990" y2="225"/>
    <line x1="600" y1="300" x2="310" y2="435"/>
    <line x1="600" y1="300" x2="890" y2="435"/>
  </g>

  <!-- hub -->
  <circle cx="600" cy="300" r="82" fill="#16a34a"/>
  <text x="600" y="296" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Nginx</text>
  <text x="600" y="322" text-anchor="middle" font-size="14" fill="#dcfce7">web server</text>

  <!-- cards -->
  <g>
    <rect x="440" y="60" width="320" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="96" text-anchor="middle" class="card-title" fill="#1d4ed8">HTTP Server</text>
    <text x="600" y="124" text-anchor="middle" class="card-text">Serves HTML / CSS / JS to the browser</text>
  </g>
  <g>
    <rect x="50" y="180" width="320" height="90" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="210" y="216" text-anchor="middle" class="card-title" fill="#c2410c">Load Balancer</text>
    <text x="210" y="244" text-anchor="middle" class="card-text">Spreads requests across many servers</text>
  </g>
  <g>
    <rect x="830" y="180" width="320" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="990" y="216" text-anchor="middle" class="card-title" fill="#6d28d9">Reverse Proxy</text>
    <text x="990" y="244" text-anchor="middle" class="card-text">Forwards requests to the backend</text>
  </g>
  <g>
    <rect x="150" y="390" width="320" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="310" y="426" text-anchor="middle" class="card-title" fill="#b91c1c">SSL Termination</text>
    <text x="310" y="454" text-anchor="middle" class="card-text">Handles HTTPS for the servers behind it</text>
  </g>
  <g>
    <rect x="730" y="390" width="320" height="90" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="890" y="426" text-anchor="middle" class="card-title" fill="#0e7490">Caching Server</text>
    <text x="890" y="454" text-anchor="middle" class="card-text">Keeps copies of responses to answer faster</text>
  </g>

  <!-- footer -->
  <rect x="50" y="515" width="700" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="74" y="548" class="head">Important Paths</text>
  <text x="74" y="580" class="mono">/usr/share/nginx/html</text><text x="360" y="580" class="label">default HTML directory (index.html)</text>
  <text x="74" y="610" class="mono">/etc/nginx/nginx.conf</text><text x="360" y="610" class="label">main configuration</text>
  <text x="74" y="640" class="mono">/var/log/nginx</text><text x="360" y="640" class="label">access.log + error.log</text>

  <rect x="780" y="515" width="370" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="804" y="548" class="head">Ports</text>
  <text x="804" y="580" class="mono">80  </text><text x="880" y="580" class="label">HTTP (browser adds it)</text>
  <text x="804" y="610" class="mono">443 </text><text x="880" y="610" class="label">HTTPS (browser adds it)</text>
  <text x="804" y="640" class="mono">8080</text><text x="880" y="640" class="label">backend - only Nginx talks to it</text>
</svg>
