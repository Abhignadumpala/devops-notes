<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 15px; fill: #475569; }
    .phase { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box-title { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .box-text { font-size: 13px; fill: #f1f5f9; }
    .mono { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; fill: #0f172a; }
    .monow { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; fill: #f8fafc; }
    .ok { font-size: 15px; font-weight: 700; fill: #15803d; }
    .bad { font-size: 15px; font-weight: 700; fill: #dc2626; }
    .step { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 15px; fill: #334155; }
    .th { font-size: 14px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="900" rx="16" fill="#ffffff"/>

  <text x="600" y="48" text-anchor="middle" class="title">MySQL Account = User + Host</text>
  <text x="600" y="76" text-anchor="middle" class="sub">root@localhost and root@% are TWO different accounts - each has its own password. All passwords live on the DB server.</text>

  <!-- Clients (left) -->
  <rect x="30" y="105" width="420" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="135" class="phase">Who logs in (and from where)</text>

  <rect x="50" y="155" width="380" height="120" rx="12" fill="#0d9488"/>
  <circle cx="75" cy="180" r="15" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="75" y="185" text-anchor="middle" class="step">1</text>
  <text x="100" y="186" class="box-title">On mysqldb itself</text>
  <text x="70" y="218" class="monow">mysql -u root -p&lt;password&gt;</text>
  <text x="70" y="245" class="box-text">no -h → connects locally → matches</text>
  <text x="70" y="264" class="box-text">root@localhost</text>

  <rect x="50" y="295" width="380" height="120" rx="12" fill="#7c3aed"/>
  <circle cx="75" cy="320" r="15" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="75" y="325" text-anchor="middle" class="step">2</text>
  <text x="100" y="326" class="box-title">From backend (schema load)</text>
  <text x="70" y="358" class="monow">mysql -h &lt;db-ip&gt; -u root -p&lt;password&gt;</text>
  <text x="70" y="385" class="box-text">from another server → matches</text>
  <text x="70" y="404" class="box-text">root@% (% = any host)</text>

  <rect x="50" y="435" width="380" height="150" rx="12" fill="#2563eb"/>
  <circle cx="75" cy="460" r="15" fill="#16a34a" stroke="#fff" stroke-width="2"/><text x="75" y="465" text-anchor="middle" class="step">3</text>
  <text x="100" y="466" class="box-title">Backend app (Node.js)</text>
  <text x="70" y="496" class="monow">backend.service:</text>
  <text x="70" y="518" class="monow">DB_USER=expense</text>
  <text x="70" y="540" class="monow">DB_PWD=&lt;copy of expense password&gt;</text>
  <text x="70" y="568" class="box-text">only a COPY - must match the DB → expense@%</text>

  <!-- DB server (right) -->
  <rect x="560" y="105" width="610" height="500" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="580" y="135" class="phase">mysqldb → table mysql.user (passwords stored as hashes)</text>

  <rect x="590" y="160" width="550" height="44" rx="8" fill="#0f766e"/>
  <text x="615" y="188" class="th">user</text><text x="760" y="188" class="th">host</text><text x="900" y="188" class="th">password (my lab)</text>

  <rect x="590" y="214" width="550" height="110" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="615" y="246" class="mono">root</text><text x="760" y="246" class="mono">localhost</text><text x="900" y="246" class="bad">EMPTY ❌</text>
  <text x="615" y="276" class="note">any password given → Access denied (ERROR 1045)</text>
  <text x="615" y="304" class="note">set-root-pass printed nothing and didn't set this one</text>

  <rect x="590" y="334" width="550" height="80" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="615" y="366" class="mono">root</text><text x="760" y="366" class="mono">%</text><text x="900" y="366" class="ok">set ✅</text>
  <text x="615" y="396" class="note">remote root from backend works → schema loaded</text>

  <rect x="590" y="424" width="550" height="80" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="615" y="456" class="mono">expense</text><text x="760" y="456" class="mono">%</text><text x="900" y="456" class="ok">set ✅</text>
  <text x="615" y="486" class="note">created by backend.sql (schema) → app gets "db":"up"</text>

  <text x="590" y="540" class="note">Check it:</text>
  <text x="590" y="565" class="mono">SELECT user, host, IF(authentication_string='',</text>
  <text x="590" y="585" class="mono">  'EMPTY','set') FROM mysql.user;</text>

  <!-- arrows -->
  <line x1="430" y1="215" x2="584" y2="250" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <line x1="430" y1="355" x2="584" y2="370" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <line x1="430" y1="510" x2="584" y2="462" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>

  <!-- Bottom fix -->
  <rect x="30" y="625" width="1140" height="255" rx="14" fill="#fefce8" stroke="#fde047"/>
  <text x="50" y="657" class="phase">🔧 The fix and the rules I keep</text>
  <circle cx="65" cy="690" r="14" fill="#16a34a"/><text x="65" y="695" text-anchor="middle" class="step">1</text>
  <text x="90" y="695" class="note">Empty password → log in with no password and set it:</text>
  <text x="90" y="720" class="mono">mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '&lt;db-root-password&gt;';"</text>
  <circle cx="65" cy="752" r="14" fill="#16a34a"/><text x="65" y="757" text-anchor="middle" class="step">2</text>
  <text x="90" y="757" class="note">Always check right after setting the password:  </text>
  <text x="430" y="757" class="mono">mysql -u root -p&lt;db-root-password&gt; -e "SELECT 1;"</text>
  <circle cx="65" cy="790" r="14" fill="#16a34a"/><text x="65" y="795" text-anchor="middle" class="step">3</text>
  <text x="90" y="795" class="note">mysql_secure_installation --set-root-pass works only ONCE. After that → ALTER USER. No restart needed - takes effect at once.</text>
  <circle cx="65" cy="828" r="14" fill="#16a34a"/><text x="65" y="833" text-anchor="middle" class="step">4</text>
  <text x="90" y="833" class="note">Passwords are SET on the DB server. The backend only USES them (schema load as root, app as expense).</text>
  <text x="90" y="862" class="sub">Editing DB_PWD in backend.service never changes a MySQL password - it only changes what the app sends.</text>
</svg>
