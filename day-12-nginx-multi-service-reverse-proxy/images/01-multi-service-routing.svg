<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 15px; fill: #475569; }
    .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .hw { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .t { font-size: 14px; fill: #0f172a; }
    .mono { font-size: 14px; fill: #0f172a; font-family: Consolas, Menlo, monospace; }
    .note { font-size: 15px; fill: #334155; }
  </style>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1200" height="790" rx="16" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="title">One Nginx in Front of Many Services</text>
  <text x="600" y="72" text-anchor="middle" class="sub">The browser only knows one address. Nginx picks the service by the path prefix.</text>

  <!-- Browser -->
  <rect x="40" y="300" width="180" height="130" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="300" width="180" height="40" rx="12" fill="#0284c7"/>
  <rect x="40" y="325" width="180" height="15" fill="#0284c7"/>
  <text x="130" y="327" text-anchor="middle" class="hw">Browser</text>
  <text x="130" y="370" text-anchor="middle" class="t">calls only</text>
  <text x="130" y="394" text-anchor="middle" class="mono">/api/...</text>
  <text x="130" y="416" text-anchor="middle" class="t">on one domain</text>
  <line x1="220" y1="365" x2="288" y2="365" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>

  <!-- Nginx -->
  <rect x="290" y="100" width="380" height="560" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="290" y="100" width="380" height="44" rx="14" fill="#16a34a"/>
  <rect x="290" y="128" width="380" height="16" fill="#16a34a"/>
  <text x="480" y="130" text-anchor="middle" class="hw">Frontend Nginx  (port 80)</text>

  <g class="mono">
    <rect x="310" y="160" width="340" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="330" y="191">location /api/catalogue/</text>
    <rect x="310" y="250" width="340" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="330" y="281">location /api/user/</text>
    <rect x="310" y="340" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="330" y="371">location /api/cart/</text>
    <rect x="310" y="430" width="340" height="50" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="330" y="461">location /api/shipping/</text>
    <rect x="310" y="520" width="340" height="50" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
    <text x="330" y="551">location /api/payment/</text>
    <rect x="310" y="590" width="340" height="50" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="330" y="621">location /  → index.html</text>
  </g>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2.5" marker-end="url(#k)">
    <line x1="650" y1="185" x2="818" y2="185"/>
    <line x1="650" y1="275" x2="818" y2="275"/>
    <line x1="650" y1="365" x2="818" y2="365"/>
    <line x1="650" y1="455" x2="818" y2="455"/>
    <line x1="650" y1="545" x2="818" y2="545"/>
    <line x1="650" y1="615" x2="818" y2="635"/>
  </g>

  <!-- Services -->
  <rect x="820" y="150" width="340" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="840" y="179" class="h">catalogue  (Node.js)</text>
  <text x="840" y="203" class="mono">http://&lt;catalogue-ip&gt;:8080/</text>
  <rect x="820" y="240" width="340" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="840" y="269" class="h">user  (Node.js)</text>
  <text x="840" y="293" class="mono">http://&lt;user-ip&gt;:8080/</text>
  <rect x="820" y="330" width="340" height="70" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="840" y="359" class="h">cart  (Node.js)</text>
  <text x="840" y="383" class="mono">http://&lt;cart-ip&gt;:8080/</text>
  <rect x="820" y="420" width="340" height="70" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="840" y="449" class="h">shipping  (Java)</text>
  <text x="840" y="473" class="mono">http://&lt;shipping-ip&gt;:8080/</text>
  <rect x="820" y="510" width="340" height="70" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="840" y="539" class="h">payment  (Python)</text>
  <text x="840" y="563" class="mono">http://&lt;payment-ip&gt;:8080/</text>
  <rect x="820" y="600" width="340" height="70" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="840" y="629" class="h">React static files</text>
  <text x="840" y="653" class="mono">/usr/share/nginx/html</text>

  <!-- Example strip -->
  <rect x="40" y="690" width="1120" height="80" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="60" y="720" class="h">Trailing / strips the prefix:</text>
  <text x="60" y="750" class="mono">/api/catalogue/product/STAN-1   →   http://&lt;catalogue-ip&gt;:8080/product/STAN-1</text>
</svg>
