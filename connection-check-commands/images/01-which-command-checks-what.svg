<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
</defs>
<rect width="1200" height="760" rx="18" fill="#ffffff"/>
<text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Which command checks which part of a connection</text>
<text x="600" y="72" text-anchor="middle" font-size="15" fill="#475569">Example: catalogue (caller) → mongodb (target) on port 27017. Check from left to right; the first ❌ is the problem.</text>
<rect x="30" y="110" width="200" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<image href="data:image/svg+xml;base64," x="50" y="128" width="44" height="44"/>
<image href="data:image/svg+xml;base64," x="180" y="132" width="30" height="30"/>
<text x="50" y="200" font-size="18" font-weight="700" fill="#0f172a">catalogue</text>
<text x="50" y="220" font-size="13" fill="#1d4ed8">CALLER</text>
<rect x="970" y="110" width="200" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<image href="data:image/svg+xml;base64," x="990" y="128" width="44" height="44"/>
<image href="data:image/svg+xml;base64," x="1124" y="130" width="32" height="32"/>
<text x="990" y="200" font-size="18" font-weight="700" fill="#0f172a">mongodb</text>
<text x="990" y="220" font-size="13" fill="#15803d">TARGET</text>
<rect x="270" y="120" width="150" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<image href="data:image/svg+xml;base64," x="325" y="128" width="40" height="40"/>
<text x="345" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">DNS</text>
<text x="345" y="208" text-anchor="middle" font-size="12" fill="#475569">name → IP</text>
<rect x="450" y="120" width="150" height="100" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<image href="data:image/svg+xml;base64," x="505" y="128" width="40" height="40"/>
<text x="525" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c">Network</text>
<text x="525" y="208" text-anchor="middle" font-size="12" fill="#475569">SG / NACL / route</text>
<rect x="630" y="120" width="150" height="100" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
<circle cx="705" cy="148" r="18" fill="#0891b2"/>
<text x="705" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">27017</text>
<text x="705" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#0891b2">Port open</text>
<text x="705" y="208" text-anchor="middle" font-size="12" fill="#475569">service listening</text>
<rect x="810" y="120" width="150" height="100" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="885" cy="148" r="18" fill="#16a34a"/>
<text x="885" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">OK</text>
<text x="885" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">App works</text>
<text x="885" y="208" text-anchor="middle" font-size="12" fill="#475569">login, data, health</text>
<line x1="230" y1="170" x2="266" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="420" y1="170" x2="446" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="600" y1="170" x2="626" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="780" y1="170" x2="806" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="960" y1="170" x2="966" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#ak)"/>
<text x="40" y="280" font-size="16" font-weight="700" fill="#1d4ed8">On CALLER</text>
<rect x="40" y="294" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="320" font-size="15" font-family="Consolas, monospace" fill="#0f172a">dig +short mongodb.&lt;domain&gt;</text>
<text x="600" y="320" font-size="14" fill="#334155">✅ DNS</text>
<rect x="40" y="342" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="368" font-size="15" font-family="Consolas, monospace" fill="#0f172a">telnet mongodb.&lt;domain&gt; 27017</text>
<text x="600" y="368" font-size="14" fill="#334155">✅ DNS ✅ Network ✅ Port</text>
<rect x="40" y="390" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="416" font-size="15" font-family="Consolas, monospace" fill="#0f172a">nc -zv mongodb.&lt;domain&gt; 27017</text>
<text x="600" y="416" font-size="14" fill="#334155">✅ DNS ✅ Network ✅ Port</text>
<rect x="40" y="438" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="464" font-size="15" font-family="Consolas, monospace" fill="#0f172a">curl -v http://catalogue:8080/health</text>
<text x="600" y="464" font-size="14" fill="#334155">✅ DNS ✅ Network ✅ Port ✅ App (HTTP apps)</text>
<rect x="40" y="486" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="512" font-size="15" font-family="Consolas, monospace" fill="#0f172a">mongosh / mysql / redis-cli -h &lt;target&gt;</text>
<text x="600" y="512" font-size="14" fill="#334155">✅ all 4 (database login)</text>
<text x="40" y="554" font-size="16" font-weight="700" fill="#15803d">On TARGET</text>
<rect x="40" y="568" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="594" font-size="15" font-family="Consolas, monospace" fill="#0f172a">systemctl status mongod</text>
<text x="600" y="594" font-size="14" fill="#334155">is the service running?</text>
<rect x="40" y="616" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="642" font-size="15" font-family="Consolas, monospace" fill="#0f172a">ss -lntp | grep 27017</text>
<text x="600" y="642" font-size="14" fill="#334155">is it listening, on 0.0.0.0 or 127.0.0.1?</text>
<rect x="40" y="664" width="1120" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="58" y="690" font-size="15" font-family="Consolas, monospace" fill="#0f172a">journalctl -u mongod  /  tail /var/log/...</text>
<text x="600" y="690" font-size="14" fill="#334155">why did it fail? (the exact error)</text>
<text x="600" y="738" text-anchor="middle" font-size="13" fill="#64748b">timeout = network (SG/NACL) · refused = not listening / down · not known = DNS · connected but app fails = app config / login</text>
</svg>