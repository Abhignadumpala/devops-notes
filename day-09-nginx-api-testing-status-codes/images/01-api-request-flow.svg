<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #1e293b; }
    .box-title { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .box-text { font-size: 14px; fill: #f1f5f9; }
    .mono { font-family: Consolas, Menlo, monospace; font-size: 14px; fill: #0f172a; }
    .mono-w { font-family: Consolas, Menlo, monospace; font-size: 14px; fill: #e2e8f0; }
    .small { font-size: 14px; fill: #334155; }
    .step { font-size: 13px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">How an API Request Travels: Browser → Frontend → Backend → DB</text>

  <!-- boxes -->
  <rect x="30" y="90" width="200" height="100" rx="12" fill="#475569"/>
  <text x="130" y="132" text-anchor="middle" class="box-title">Browser</text>
  <text x="130" y="158" text-anchor="middle" class="box-text">user clicks "Add Expense"</text>

  <rect x="350" y="90" width="200" height="100" rx="12" fill="#16a34a"/>
  <text x="450" y="132" text-anchor="middle" class="box-title">Frontend (Nginx)</text>
  <text x="450" y="158" text-anchor="middle" class="box-text">public IP · port 80</text>

  <rect x="670" y="90" width="200" height="100" rx="12" fill="#2563eb"/>
  <text x="770" y="132" text-anchor="middle" class="box-title">Backend</text>
  <text x="770" y="158" text-anchor="middle" class="box-text">private IP · port 8080</text>

  <rect x="970" y="90" width="200" height="100" rx="12" fill="#ea580c"/>
  <text x="1070" y="132" text-anchor="middle" class="box-title">MySQL</text>
  <text x="1070" y="158" text-anchor="middle" class="box-text">port 3306</text>

  <!-- request arrows -->
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="232" y1="120" x2="346" y2="120"/>
    <line x1="552" y1="120" x2="666" y2="120"/>
    <line x1="872" y1="120" x2="966" y2="120"/>
  </g>
  <circle cx="289" cy="104" r="11" fill="#475569"/><text x="289" y="109" text-anchor="middle" class="step">1</text>
  <circle cx="609" cy="104" r="11" fill="#475569"/><text x="609" y="109" text-anchor="middle" class="step">2</text>
  <circle cx="919" cy="104" r="11" fill="#475569"/><text x="919" y="109" text-anchor="middle" class="step">3</text>

  <!-- response arrows -->
  <g stroke="#16a34a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#g)">
    <line x1="966" y1="165" x2="874" y2="165"/>
    <line x1="666" y1="165" x2="554" y2="165"/>
    <line x1="346" y1="165" x2="234" y2="165"/>
  </g>
  <circle cx="919" cy="182" r="11" fill="#16a34a"/><text x="919" y="187" text-anchor="middle" class="step">4</text>
  <circle cx="609" cy="182" r="11" fill="#16a34a"/><text x="609" y="187" text-anchor="middle" class="step">5</text>
  <circle cx="289" cy="182" r="11" fill="#16a34a"/><text x="289" y="187" text-anchor="middle" class="step">6</text>

  <!-- details -->
  <rect x="30" y="225" width="360" height="200" rx="12" fill="#0f172a"/>
  <text x="50" y="254" font-size="15" font-weight="700" fill="#94a3b8">1. Browser sends</text>
  <text x="50" y="282" class="mono-w"><tspan fill="#fdba74">POST</tspan> &lt;frontend-ip&gt;/api/transaction</text>
  <text x="50" y="312" class="mono-w">{</text>
  <text x="70" y="334" class="mono-w"><tspan fill="#7dd3fc">"amount"</tspan>: <tspan fill="#fdba74">100</tspan>,</text>
  <text x="70" y="356" class="mono-w"><tspan fill="#7dd3fc">"category"</tspan>: <tspan fill="#86efac">"Food"</tspan>,</text>
  <text x="70" y="378" class="mono-w"><tspan fill="#7dd3fc">"description"</tspan>: <tspan fill="#86efac">"dosa"</tspan></text>
  <text x="50" y="400" class="mono-w">}</text>

  <rect x="410" y="225" width="380" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="254" font-size="15" font-weight="700" fill="#15803d">2. Nginx sees /api/ → forwards</text>
  <text x="430" y="284" class="mono">/api/transaction</text>
  <text x="430" y="306" class="small">is converted to the backend URL</text>
  <text x="430" y="332" class="mono">http://&lt;backend-private-ip&gt;:8080</text>
  <text x="430" y="352" class="mono">       /transaction</text>
  <text x="430" y="384" class="small">Set in expense.conf:</text>
  <text x="430" y="406" class="mono">location /api/ { proxy_pass ... }</text>

  <rect x="810" y="225" width="360" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="830" y="254" font-size="15" font-weight="700" fill="#1d4ed8">3-6. Backend saves &amp; replies</text>
  <text x="830" y="284" class="small">3. Backend inserts the row into MySQL</text>
  <text x="830" y="310" class="small">4. DB confirms it's saved</text>
  <text x="830" y="336" class="small">5. Backend replies to Nginx</text>
  <text x="830" y="362" class="small">6. Nginx passes the reply to the browser</text>
  <rect x="830" y="378" width="180" height="32" rx="6" fill="#16a34a"/>
  <text x="920" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">201 Created</text>

  <text x="600" y="470" text-anchor="middle" class="small">The browser only ever talks to the frontend. The /api → backend routing is set up in the Nginx config,</text>
  <text x="600" y="492" text-anchor="middle" class="small">and the /transaction API itself is written by the developers.</text>
</svg>
