<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Shipping: one root cause, a chain of errors</text>
  <text x="480" y="64" text-anchor="middle" font-size="14" fill="#475569">RoboShop v2 · 2026-10-28 · same script as v1, newer RHEL 9.8 packages</text>

  <!-- root cause -->
  <rect x="230" y="84" width="500" height="78" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">ROOT CAUSE: RHEL crypto-policy update</text>
  <text x="480" y="134" text-anchor="middle" font-size="13" fill="#78350f">Java 25 offers the new TLS lock X25519MLKEM768 …</text>
  <text x="480" y="152" text-anchor="middle" font-size="13" fill="#78350f">… but can't generate it → every Java TLS handshake fails</text>

  <!-- branches -->
  <path d="M380,162 L210,212" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M580,162 L750,212" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- error 1 -->
  <rect x="40" y="214" width="340" height="112" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">① Build time: mvn clean package</text>
  <text x="210" y="262" text-anchor="middle" font-size="13" fill="#7f1d1d">mvn → HTTPS → Maven Central ❌</text>
  <text x="210" y="282" text-anchor="middle" font-size="13" fill="#7f1d1d">Installing dependencies..FAILED</text>
  <text x="210" y="306" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#7f1d1d">Could not generate keypair: X25519MLKEM768</text>

  <!-- error 2 -->
  <rect x="580" y="214" width="340" height="112" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">② Run time: java -jar shipping.jar</text>
  <text x="750" y="262" text-anchor="middle" font-size="13" fill="#7f1d1d">app → TLS → MySQL :3306 ❌</text>
  <text x="750" y="282" text-anchor="middle" font-size="13" fill="#7f1d1d">port 8080 never opens → curl refused</text>
  <text x="750" y="306" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#7f1d1d">Communications link failure</text>

  <!-- fix 1 -->
  <path d="M210,326 L210,360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="362" width="340" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">FIX in 08-shipping.sh</text>
  <text x="210" y="410" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">export MAVEN_OPTS="-Djdk.tls.namedGroups=</text>
  <text x="210" y="426" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">x25519,secp256r1,secp384r1"</text>

  <!-- restart loop -->
  <path d="M750,326 L750,360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="580" y="362" width="340" height="76" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="750" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">systemd restart loop</text>
  <text x="750" y="410" text-anchor="middle" font-size="13" fill="#7c2d12">Restart=on-failure, RestartSec=5</text>
  <text x="750" y="428" text-anchor="middle" font-size="13" fill="#7c2d12">fail → restart → fail → … every 5 s</text>

  <!-- error 3 -->
  <path d="M750,438 L750,472" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="580" y="474" width="340" height="94" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">③ MySQL blocks shipping's IP</text>
  <text x="750" y="522" text-anchor="middle" font-size="13" fill="#7f1d1d">100 failed connects (max_connect_errors)</text>
  <text x="750" y="546" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#7f1d1d">ERROR 1129: Host '172.31.14.32' is blocked</text>

  <!-- fix 2 -->
  <rect x="300" y="474" width="250" height="94" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="425" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">FIX in shipping.service</text>
  <text x="425" y="522" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">ExecStart=/bin/java</text>
  <text x="425" y="538" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">-Djdk.tls.namedGroups=...</text>
  <text x="425" y="554" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">-jar /app/shipping.jar</text>
  <path d="M580,300 C520,330 470,420 440,472" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>

  <!-- fix 3 -->
  <path d="M750,568 L750,600" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="520" y="602" width="400" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">FIX on the mysql server (local root: no password)</text>
  <text x="720" y="648" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">mysql -uroot -e "TRUNCATE TABLE</text>
  <text x="720" y="664" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">performance_schema.host_cache;"</text>

  <!-- result -->
  <rect x="40" y="602" width="440" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="630" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">✅ Result: script 33 s, all SUCCESS</text>
  <text x="260" y="654" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1e3a8a">/actuator/health → "status":"UP", db UP</text>
  <path d="M520,640 L484,640" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
