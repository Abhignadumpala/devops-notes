<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 28px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 15px; fill: #475569; }
    .phase { font-size: 17px; font-weight: 700; fill: #1e293b; }
    .box-title { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .box-text { font-size: 14px; fill: #f1f5f9; }
    .label { font-size: 14px; fill: #0f172a; }
    .money { font-size: 15px; font-weight: 700; fill: #854d0e; }
    .step { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 15px; fill: #334155; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect width="1200" height="840" rx="16" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="title">What Happens When You Buy a Domain (mydevops.com)</text>
  <text x="600" y="72" text-anchor="middle" class="sub">You buy from a registrar (the shop). The registrar registers it with the TLD registry (the owner of the .com list).</text>

  <!-- ===== Phase 1: buying ===== -->
  <rect x="20" y="90" width="1160" height="320" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="40" y="116" class="phase">Steps 1-4: Buying the domain</text>

  <rect x="40" y="135" width="220" height="255" rx="12" fill="#475569"/>
  <text x="150" y="245" text-anchor="middle" class="box-title">You</text>
  <text x="150" y="272" text-anchor="middle" class="box-text">want mydevops.com</text>

  <rect x="480" y="135" width="240" height="255" rx="12" fill="#7c3aed"/>
  <text x="600" y="225" text-anchor="middle" class="box-title">Registrar</text>
  <text x="600" y="252" text-anchor="middle" class="box-text">GoDaddy / Namecheap</text>
  <text x="600" y="274" text-anchor="middle" class="box-text">the shop - sells to public</text>
  <text x="600" y="296" text-anchor="middle" class="box-text">earns a commission</text>

  <rect x="940" y="135" width="220" height="255" rx="12" fill="#ea580c"/>
  <text x="1050" y="225" text-anchor="middle" class="box-title">.com Registry</text>
  <text x="1050" y="252" text-anchor="middle" class="box-text">TLD registry</text>
  <text x="1050" y="274" text-anchor="middle" class="box-text">keeps the .com list</text>
  <text x="1050" y="296" text-anchor="middle" class="box-text">doesn't sell to public</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="262" y1="185" x2="476" y2="185"/>
    <line x1="262" y1="290" x2="476" y2="290"/>
  </g>
  <g stroke="#7c3aed" stroke-width="3" marker-end="url(#p)">
    <line x1="722" y1="185" x2="936" y2="185"/>
    <line x1="722" y1="330" x2="936" y2="330"/>
  </g>
  <line x1="938" y1="235" x2="724" y2="235" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#o)"/>
  <line x1="478" y1="365" x2="264" y2="365" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#p)"/>

  <!-- labels -->
  <circle cx="284" cy="167" r="12" fill="#475569"/><text x="284" y="172" text-anchor="middle" class="step">1</text>
  <text x="302" y="172" class="label">Search mydevops.com</text>

  <circle cx="744" cy="167" r="12" fill="#7c3aed"/><text x="744" y="172" text-anchor="middle" class="step">2</text>
  <text x="762" y="172" class="label">"Is it already taken?"</text>
  <text x="762" y="225" class="label" font-weight="700">"No, it's free ✓"</text>

  <circle cx="284" cy="272" r="12" fill="#475569"/><text x="284" y="277" text-anchor="middle" class="step">3</text>
  <text x="302" y="277" class="label">Name, contact, payment</text>

  <circle cx="744" cy="297" r="12" fill="#7c3aed"/><text x="744" y="302" text-anchor="middle" class="step">4</text>
  <text x="762" y="302" class="label">Register it + save its</text>
  <text x="762" y="320" class="label" font-weight="700">nameservers (NS)</text>

  <text x="290" y="355" class="label" font-weight="700">"Domain is yours ✓"</text>

  <!-- ===== Money flow ===== -->
  <rect x="20" y="425" width="1160" height="70" rx="14" fill="#fefce8" stroke="#fde047"/>
  <text x="40" y="466" class="money">Money flow:</text>
  <rect x="150" y="443" width="140" height="34" rx="17" fill="#475569"/>
  <text x="220" y="465" text-anchor="middle" class="step" font-size="14">You pay</text>
  <line x1="292" y1="460" x2="356" y2="460" stroke="#ca8a04" stroke-width="3" marker-end="url(#y)"/>
  <rect x="360" y="443" width="260" height="34" rx="17" fill="#7c3aed"/>
  <text x="490" y="465" text-anchor="middle" class="step" font-size="14">Registrar keeps a commission</text>
  <line x1="622" y1="460" x2="686" y2="460" stroke="#ca8a04" stroke-width="3" marker-end="url(#y)"/>
  <rect x="690" y="443" width="230" height="34" rx="17" fill="#ea580c"/>
  <text x="805" y="465" text-anchor="middle" class="step" font-size="14">pays the registry its fee</text>
  <text x="940" y="466" class="note">(renew every year)</text>

  <!-- ===== Phase 2: lookups ===== -->
  <rect x="20" y="510" width="1160" height="230" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="536" class="phase">Step 5: From now on, anyone looking up mydevops.com gets routed like this</text>

  <rect x="40" y="560" width="240" height="100" rx="12" fill="#dc2626"/>
  <text x="160" y="600" text-anchor="middle" class="box-title">Root servers</text>
  <text x="160" y="626" text-anchor="middle" class="box-text">"ask the .com registry"</text>

  <rect x="340" y="560" width="240" height="100" rx="12" fill="#ea580c"/>
  <text x="460" y="600" text-anchor="middle" class="box-title">.com Registry</text>
  <text x="460" y="626" text-anchor="middle" class="box-text">has your NS from step 4</text>

  <rect x="640" y="560" width="240" height="100" rx="12" fill="#0d9488"/>
  <text x="760" y="600" text-anchor="middle" class="box-title">Your nameservers</text>
  <text x="760" y="626" text-anchor="middle" class="box-text">hold your A record</text>

  <rect x="940" y="560" width="230" height="100" rx="12" fill="#16a34a"/>
  <text x="1055" y="600" text-anchor="middle" class="box-title">203.0.113.10</text>
  <text x="1055" y="626" text-anchor="middle" class="box-text">the IP you configured</text>

  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="282" y1="610" x2="336" y2="610"/>
    <line x1="582" y1="610" x2="636" y2="610"/>
    <line x1="882" y1="610" x2="936" y2="610"/>
  </g>

  <text x="760" y="690" text-anchor="middle" class="note">Default: registrar's own NS (GoDaddy).</text>
  <text x="760" y="712" text-anchor="middle" class="note">Or point to Cloudflare / AWS Route 53.</text>
  <text x="300" y="700" class="note" font-weight="700">Step 4 is the link</text>
  <text x="300" y="720" class="note" text-anchor="start">that makes DNS lookups find you</text>

  <text x="600" y="780" text-anchor="middle" class="note">Registrar = the shop you buy from · Registry = owner of the TLD list (.com, .in ...) · Registries don't sell directly to the public</text>
  <text x="600" y="808" text-anchor="middle" class="sub">Solid arrow = request · Dashed arrow = reply back</text>
</svg>
