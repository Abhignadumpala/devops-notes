<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/></marker>
  </defs>
  <rect width="900" height="720" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">archive.sh: 4 checks before archiving</text>

  <!-- command -->
  <rect x="150" y="58" width="600" height="44" rx="8" fill="#1f2328"/>
  <text x="450" y="86" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#ffffff">sh archive.sh /var/log/roboshop /home/ec2-user/backup 14</text>
  <path d="M300 102 V132" stroke="#57606a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- check boxes -->
  <g font-size="15">
    <!-- 1 -->
    <rect x="80" y="134" width="440" height="78" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="100" y="160" font-weight="700" fill="#0969da">Check 1: did the user type both folder names?</text>
    <text x="100" y="184" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2328">[ -z "$source_dir" ] || [ -z "$dest_dir" ]</text>
    <text x="100" y="203" font-size="13" fill="#57606a">either directory missing → true → error</text>

    <!-- 2 -->
    <rect x="80" y="262" width="440" height="66" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="100" y="288" font-weight="700" fill="#0969da">Check 2: does the source folder exist?</text>
    <text x="100" y="312" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2328">[ ! -d "$source_dir" ]</text>

    <!-- 3 -->
    <rect x="80" y="378" width="440" height="66" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="100" y="404" font-weight="700" fill="#0969da">Check 3: does the destination folder exist?</text>
    <text x="100" y="428" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2328">[ ! -d "$dest_dir" ]</text>

    <!-- find -->
    <rect x="80" y="494" width="440" height="50" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
    <text x="100" y="525" font-weight="700" fill="#1f2328">find old *.log files → save list in files_to_archive</text>

    <!-- 4 -->
    <rect x="80" y="572" width="440" height="66" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="100" y="598" font-weight="700" fill="#0969da">Check 4: did find find any old log files?</text>
    <text x="100" y="622" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2328">[ -z "$files_to_archive" ]</text>

    <!-- next -->
    <rect x="160" y="664" width="280" height="40" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="300" y="689" text-anchor="middle" font-weight="700" fill="#1a7f37">✔ next: tar (compress) → delete</text>
  </g>

  <!-- down arrows with labels -->
  <g stroke="#1a7f37" stroke-width="2.5" fill="none">
    <path d="M300 212 V258" marker-end="url(#a)"/>
    <path d="M300 328 V374" marker-end="url(#a)"/>
    <path d="M300 444 V490" marker-end="url(#a)"/>
    <path d="M300 544 V568" marker-end="url(#a)"/>
    <path d="M300 638 V660" marker-end="url(#a)"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1a7f37">
    <text x="310" y="241">false → both given, OK</text>
    <text x="310" y="357">exists, OK</text>
    <text x="310" y="473">exists, OK</text>
    <text x="310" y="655">false → files found</text>
  </g>

  <!-- side exits -->
  <g stroke-width="2.5" fill="none">
    <path d="M520 173 H590" stroke="#cf222e" marker-end="url(#r)"/>
    <path d="M520 295 H590" stroke="#cf222e" marker-end="url(#r)"/>
    <path d="M520 411 H590" stroke="#cf222e" marker-end="url(#r)"/>
    <path d="M520 605 H590" stroke="#9a6700" marker-end="url(#y)"/>
  </g>
  <g font-size="12" font-weight="700">
    <text x="527" y="165" fill="#cf222e">true</text>
    <text x="527" y="287" fill="#cf222e">no</text>
    <text x="527" y="403" fill="#cf222e">no</text>
    <text x="527" y="597" fill="#9a6700">true</text>
  </g>
  <g font-size="13">
    <rect x="594" y="146" width="290" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="606" y="168" fill="#cf222e" font-weight="700">✖ usage + exit 1</text>
    <text x="606" y="188" fill="#1f2328">"Either source or destination ... missing"</text>

    <rect x="594" y="268" width="290" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="606" y="290" fill="#cf222e" font-weight="700">✖ exit 1</text>
    <text x="606" y="310" fill="#1f2328">"Source Directory: ... does not exist"</text>

    <rect x="594" y="384" width="290" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="606" y="406" fill="#cf222e" font-weight="700">✖ exit 1</text>
    <text x="606" y="426" fill="#1f2328">"Destination Directory: ... does not exist"</text>

    <rect x="594" y="578" width="290" height="56" rx="8" fill="#fff8c5" stroke="#9a6700"/>
    <text x="606" y="600" fill="#9a6700" font-weight="700">exit 0 (nothing to do, not an error)</text>
    <text x="606" y="620" fill="#1f2328">"No log files found older than 14 days"</text>
  </g>
</svg>
